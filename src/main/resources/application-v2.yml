server:
  port: 8080

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/framework?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:framework}
    password: ${DB_PASSWORD:framework123!}
    driver-class-name: org.mariadb.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        
  # JWT 설정
  jwt:
    secret: mySecretKeyForV2Version
    expiration: 86400 # 24시간 (초 단위)

# 로깅 설정
logging:
  level:
    com.wan.framework: DEBUG
    org.springframework.web: DEBUG
    org.hibernate: WARN

# 보안 설정
security:
  basic:
    enabled: false
  cors:
    allowed-origins: "*"
    allowed-methods: GET, POST, PUT, DELETE, OPTIONS
    allowed-headers: "*"