spring:
  application:
    name: framework

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    url: jdbc:mariadb://${DB_HOST:mariadb}:${DB_PORT:3306}/${DB_NAME:framework}
    username: ${DB_USERNAME:framework_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}  # 운영: validate, 개발: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MariaDBDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always

  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    # session 설정은 SessionProperties에서 관리 (중복 방지)
    # Spring Session 사용 시 server.servlet.session.cookie 설정은 무시됨

# 보안 설정
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://yourdomain.com}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    max-age: ${CORS_MAX_AGE:3600}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.wan.framework: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_BIND:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/framework/application.log
    max-size: 10MB
    max-history: 30

# 비밀번호 암호화 설정
password:
  salt:
    size: ${PASSWORD_SALT_SIZE:16}
  iteration: ${PASSWORD_ITERATION:10000}

# 파일 업로드 설정
file:
  upload:
    upload-dir: ${FILE_UPLOAD_DIR:/app/uploads/board}
    max-file-size: 10485760  # 10MB
    max-request-size: 52428800  # 50MB
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
      - txt
      - zip
      - rar

# 액추에이터 설정 (모니터링)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# 커스텀 세션 설정 (SessionProperties와 바인딩)
session:
  cookie:
    name: SESSION_ID
    path: /
    http-only: true
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Lax}
    max-age: 1800
    domain: ${COOKIE_DOMAIN:}

  security:
    validate-ip: ${SESSION_VALIDATE_IP:false}
    validate-user-agent: ${SESSION_VALIDATE_UA:false}
    trusted-proxies: ${SESSION_TRUSTED_PROXIES:}

  refresh:
    enabled: ${SESSION_REFRESH_ENABLED:true}
    threshold: ${SESSION_REFRESH_THRESHOLD:0.5}

  concurrent:
    enabled: ${SESSION_CONCURRENT_ENABLED:true}
    max-sessions: ${SESSION_MAX_SESSIONS:3}
    prevent-login: ${SESSION_PREVENT_LOGIN:false}

# swagger 제거
springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false