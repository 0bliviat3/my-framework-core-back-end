# 외부 설정 파일 (JAR 직접 실행 시 사용)
# 이 파일을 JAR 파일과 같은 디렉토리 또는 config/ 디렉토리에 배치하세요.

spring:
  application:
    name: framework

  datasource:
    url: jdbc:mariadb://localhost:3306/framework
    username: framework_user
    password: CHANGE_ME_IN_PRODUCTION
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    redis:
      host: localhost
      port: 6379
      password: CHANGE_ME_IN_PRODUCTION

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 8080

# 보안 설정
security:
  cors:
    allowed-origins: https://yourdomain.com
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    max-age: 3600

logging:
  level:
    root: INFO
    com.wan.framework: INFO

# 이 파일의 값들을 프로덕션 환경에 맞게 수정하세요!
